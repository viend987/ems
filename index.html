<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>LSFD RP — Panduan RP Ketik Los Santos Fire Department</title>
    <meta
      name="description"
      content="Panduan RP ketik LSFD di JGVRP: prosedur penanganan korban, radio, DEAT, ABC, dan kamus kode. Klik untuk menyalin teks RP."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Kedua font dipakai di layar pertama (judul header dan teks langkah). Tanpa
         preload, browser baru menemukannya setelah CSS selesai diparse. -->
    <link rel="preload" href="/src/assets/fonts/saira-condensed-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- Tema dipasang sebelum bundel jalan, supaya pengguna tema gelap tidak
         kena kedip putih. Bawaannya terang, dan localStorage bisa tidak ada. -->
    <script>
      try {
        var t = localStorage.getItem('lsfd:theme')
        if (t === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#0A0A0B'
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
